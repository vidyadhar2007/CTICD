{% extends "base.html" %}

{% block content %}

<div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
    <div>
        <h1 class="h3 fw-bold mb-1 text-white">
            <i class="bi bi-key-fill text-warning"></i> Modify Operator Credential
        </h1>
        <p class="text-secondary mb-0 small">Update your encrypted session credentials and certificate authorization.</p>
    </div>
    <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back to Profile
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="cyber-card p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-light fw-bold small">Current Password</label>
                    <input type="password" name="current_password" class="form-control cyber-input" placeholder="••••••••" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light fw-bold small">New Password</label>
                    <input type="password" name="new_password" class="form-control cyber-input" placeholder="Minimum 6 characters" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light fw-bold small">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control cyber-input" placeholder="Repeat new password" required>
                </div>

                <div class="d-flex align-items-center justify-content-between">
                    <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                    <button type="submit" class="btn cyber-btn">
                        <i class="bi bi-shield-lock"></i> Update Credential
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
