{% extends "base.html" %}
{% block content %}

<div class="pro-layout">
    <main class="pro-main" style="margin-left:0;width:100%;">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2>Change Password</h2>
                <p class="text-secondary">Update your account password</p>

                <form method="POST">
                    <div class="mb-3">
                        <label>Current Password</label>
                        <input type="password" name="current_password" class="form-control cyber-input" required>
                    </div>

                    <div class="mb-3">
                        <label>New Password</label>
                        <input type="password" name="new_password" class="form-control cyber-input" required>
                    </div>

                    <div class="mb-3">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control cyber-input" required>
                    </div>

                    <button class="btn cyber-btn w-100">Update Password</button>
                </form>

                <br>
                <a href="{{ url_for('profile') }}">Back to Profile</a>
            </div>
        </div>
    </main>
</div>

{% endblock %}
