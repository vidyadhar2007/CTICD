{% extends "base.html" %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="text-center mb-2">Create Analyst Account</h2>
        <p class="text-center text-secondary mb-4">
            Join Cyber Threat Intelligence Platform
        </p>

        <form method="POST">
            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control cyber-input" required>
            </div>

            <div class="mb-3">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control cyber-input" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control cyber-input" required>
            </div>

            <button class="btn cyber-btn w-100 mt-2">
                Create Account
            </button>
        </form>

        <p class="text-center mt-3">
            Already registered?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</div>

{% endblock %}
