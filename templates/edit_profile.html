{% extends "base.html" %}
{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Edit Profile</h2>
        <p class="text-secondary">Update your CTICD account information</p>

        <form method="POST">
            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control cyber-input" value="{{ current_user.name or '' }}" required>
            </div>

            <div class="mb-3">
                <label>Email Address</label>
                <input type="email" class="form-control cyber-input" value="{{ current_user.email or '' }}" disabled>
            </div>

            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="text" name="mobile" class="form-control cyber-input" value="{{ current_user.mobile if current_user.mobile is defined else '' }}">
            </div>

            <button type="submit" class="btn cyber-btn w-100">Save Changes</button>
        </form>

        <br>

        <a href="{{ url_for('profile') }}">Back to Profile</a>
    </div>
</div>

{% endblock %}
