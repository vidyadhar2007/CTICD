{% extends "base.html" %}

{% block auth_content %}

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2>CTICD OPERATIONS</h2>
            <p>Cyber Threat Intelligence Correlation Platform</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-light small fw-bold">Analyst Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="email" name="email" class="form-control cyber-input" placeholder="analyst@cticd.soc" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" class="form-control cyber-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn cyber-btn w-100 py-2 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Authenticate & Enter SOC
            </button>

            <div class="d-flex align-items-center justify-content-between small text-muted">
                <span>Default: <code class="text-info">analyst@cticd.soc</code></span>
                <span>Pass: <code class="text-info">Analyst@2026</code></span>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 small">
            <span class="text-secondary">Need new operator credentials?</span>
            <a href="{{ url_for('signup') }}" class="text-info fw-bold text-decoration-none ms-1">Register Analyst</a>
        </div>
    </div>
</div>

{% endblock %}
